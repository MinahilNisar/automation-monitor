name: automation-monitor
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: automation_monitor
      POSTGRES_USER: automation_monitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup:env first}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automation_monitor -d automation_monitor"]
      interval: 5s
      timeout: 5s
      retries: 12
