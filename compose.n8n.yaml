# Use with: docker compose -f compose.yaml -f compose.n8n.yaml ...
services:
  monitor-api:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      FRONTEND_URL: http://localhost:3000
      N8N_CONNECTION_FILE: /integration/n8n-connection.json
      N8N_WEBHOOK_ORIGIN: http://n8n:5678
      DATABASE_URL: postgresql://automation_monitor:${POSTGRES_PASSWORD}@postgres:5432/automation_monitor?schema=public
    volumes:
      - ./.data/n8n-monitor:/integration:ro
    ports:
      - "127.0.0.1:3002:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 24
  n8n:
    image: n8nio/n8n:2.40.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      GENERIC_TIMEZONE: Asia/Karachi
      TZ: Asia/Karachi
      N8N_HOST: localhost
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:5678
      WEBHOOK_URL: http://localhost:5678/
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
    volumes:
      - ./.data/n8n:/home/node/.n8n
      - ./.data/n8n-import:/imports:ro
    depends_on:
      monitor-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
